<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmCircle - Register</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <meta name="description" content="Join the FarmCircle Co-Op and start your weekly subscription.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">
  <div class="auth-toolbar">
    <button class="icon-btn theme-toggle" aria-label="Toggle theme"><i class="ph ph-moon"></i></button>
    <button class="icon-btn rtl-toggle" aria-label="Toggle direction"><i class="ph ph-arrows-left-right"></i></button>
  </div>

  <div class="auth-card">
    <div class="auth-head">
      <a href="index.html" class="auth-logo"><i class="ph ph-plant"></i> FarmCircle</a>
      <h1 class="auth-title">Join the Co-Op</h1>
      <p class="auth-subtitle">Create an account to get fresh, local harvests delivered to your door</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="address" class="form-label">Delivery Address</label>
        <textarea id="address" name="address" class="form-control" rows="2" autocomplete="street-address" required></textarea>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
        </div>
      </div>

      <div class="checkbox-group auth-terms">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="coming-soon.html" class="auth-link-inline">Terms &amp; Conditions</a> and the <a href="coming-soon.html" class="auth-link-inline">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
    </form>

    <div class="auth-divider">or</div>

    <button class="btn btn-google">
      <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="btn btn-apple">
      <i class="ph-fill ph-apple-logo"></i>
      Continue with Apple
    </button>

    <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initFormValidation('registerForm');
    });
  </script>
</body>
</html>
